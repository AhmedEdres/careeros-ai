name: Fix Ahmed filter import and rerun tests
on:
  push:
    branches:
      - fix/careeros-4.3.5-filters
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Fix missing normalize_text import
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('careeros/__init__.py')
          s=p.read_text(encoding='utf-8')
          if 'from .text import normalize_text' not in s:
              s=s.replace('from .profile import DEFAULT_PROFILE, Profile\n', 'from .profile import DEFAULT_PROFILE, Profile\nfrom .text import normalize_text\n', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit import fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-ahmed-import.yml
          git add -A
          git commit -m "fix: import normalize_text for Ahmed hard gate [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
      - name: Full suite
        run: python -m pytest -q
