name: Apply remaining Ahmed filter corrections
on:
  push:
    branches:
      - fix/careeros-4.3.5-filters
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Apply patch
        run: python scripts/apply_ahmed_missing_435.py
      - name: Commit source changes before verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply_ahmed_missing_435.py .github/workflows/apply-ahmed-missing-435.yml
          git add -A
          git commit -m "Fix Ahmed filter: reject foreign C+E/D jobs, IT governance, and fake STRONG [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
      - name: Run full suite and write verification report
        id: tests
        continue-on-error: true
        run: |
          set +e
          python -m pytest -q > /tmp/ahmed-tests.txt 2>&1
          status=$?
          {
            echo "# Ahmed 4.3.5 patch verification"
            echo
            echo "Exit status: $status"
            echo
            echo '```text'
            cat /tmp/ahmed-tests.txt
            echo '```'
          } > AHMED_PATCH_TEST_REPORT.md
          exit $status
      - name: Replay live titles
        continue-on-error: true
        run: |
          python - <<'PY' >> AHMED_PATCH_TEST_REPORT.md 2>&1
          from careeros import DEFAULT_PROFILE, calculate_match, hard_filter_job
          titles = [
            ("Sofer profesionist C+E - Olanda", "Timișoara, Iași (Iași), Brașov și alte 2 orașe"),
            ("Sofer camion Categoria C+E -Germania", "Timișoara, România"),
            ("SOFER AUTOBUZ - OLANDA", "Timișoara, România"),
            ("Senior Regional IT Governance and Quality Coordinator EMEA - Tires", "Timisoara"),
            ("Operations Manager @Continental", "Timisoara"),
            ("Compliance Officer EMEA (m/f/d)", "Timisoara"),
            ("Transport coordinator", "Timișoara"),
            ("Customer Support Specialist", "Timișoara, România"),
            ("Customer Service Support", "Timișoara, România"),
            ("Șofer categoria B", "Timișoara"),
          ]
          print('\n## Live-title replay\n')
          for title, loc in titles:
            j={"title":title,"description":"English required. Category B where relevant.","location":{"display_name":loc},"company":{"display_name":"X"},"salary_text":"8000 RON net","category":{"label":""}}
            keep, reason=hard_filter_job(j, DEFAULT_PROFILE)
            if keep:
              r=calculate_match(j, DEFAULT_PROFILE)
              print(title, 'KEEP=True', 'score=', r.score, 'verdict=', r.verdict, 'reason=', reason)
            else:
              print(title, 'KEEP=False', reason)
          PY
      - name: Publish verification report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AHMED_PATCH_TEST_REPORT.md
          git commit -m "test: record Ahmed filter verification [skip ci]" || true
          git push origin HEAD:${{ github.ref_name }} || true
