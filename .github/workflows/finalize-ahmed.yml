name: Finalize Ahmed policy corrections
on:
  push:
    branches:
      - fix/careeros-4.3.5-filters
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Apply final patch
        run: python scripts/finalize_ahmed_435.py
      - name: Remove helper and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/finalize_ahmed_435.py .github/workflows/finalize-ahmed.yml
          git add -A
          git commit -m "Fix Ahmed filter: finalize recruiter realism and reachability [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
      - name: Full suite
        run: python -m pytest -q
